<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 383 283" width="383" height="283" role="img" aria-labelledby="t">
  <title id="t">Pipeline architecture: BLS LAUS, BLS OEWS, and Census ACS sources, Python extract into DuckDB, dbt staging to intermediate to marts, CSV exports</title>
  <style>
    svg { --fg: #111; --muted: #555; --line: #888; --bg: #fff; }
    @media (prefers-color-scheme: dark) {
      svg { --fg: #e6e6e6; --muted: #a8a8a8; --line: #777; --bg: #111; }
    }
    rect { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
    text { font-family: Verdana, Geneva, Tahoma, sans-serif; fill: var(--fg); font-size: 14px; }
    .sub { fill: var(--muted); font-size: 12px; }
    .arrow { stroke: var(--line); stroke-width: 1.2; fill: none; marker-end: url(#a); }
    marker path { fill: var(--line); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" />
    </marker>
  </defs>

  <rect x="1" y="1" width="380" height="52" />
  <text x="14" y="23">BLS LAUS · BLS OEWS · Census ACS</text>
  <text class="sub" x="14" y="42">APIs + bulk flat files</text>

  <rect x="1" y="77" width="380" height="52" />
  <text x="14" y="99">Extract (Python)</text>
  <text class="sub" x="14" y="118">raw data into DuckDB; raw copies to S3</text>

  <rect x="1" y="153" width="380" height="52" />
  <text x="14" y="175">dbt on DuckDB</text>
  <text class="sub" x="14" y="194">staging → intermediate → marts</text>

  <rect x="1" y="229" width="380" height="52" />
  <text x="14" y="251">Output</text>
  <text class="sub" x="14" y="270">mart CSV exports + written findings</text>

  <path class="arrow" d="M191,53 V75" />
  <path class="arrow" d="M191,129 V151" />
  <path class="arrow" d="M191,205 V227" />
</svg>
