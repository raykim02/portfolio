<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 383 207" width="383" height="207" role="img" aria-labelledby="t">
  <title id="t">Pipeline architecture: EIA Short-Term Energy Outlook API, Python pipeline with pandas, CSV exports and a Matplotlib chart</title>
  <style>
