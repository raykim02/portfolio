<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 452" width="420" height="452" role="img" aria-labelledby="t">
  <title id="t">Pipeline architecture: USASpending bulk files, Python extract, S3, Redshift Serverless, dbt, Power BI. Airflow runs extract, load, and dbt monthly.</title>
  <style>
    svg { --fg: #111; --muted: #555; --line: #888; --bg: #fff; }
    @media (prefers-color-scheme: dark) {
      svg { --fg: #e6e6e6; --muted: #a8a8a8; --line: #777; --bg: #111; }
    }
    rect { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
    text { font-family: Verdana, Geneva, Tahoma, sans-serif; fill: var(--fg); font-size: 14px; }
    .sub { fill: var(--muted); font-size: 12px; }
    .arrow { stroke: var(--line); stroke-width: 1.2; fill: none; marker-end: url(#a); }
    .bracket { stroke: var(--line); stroke-width: 1; fill: none; stroke-dasharray: 4 4; }
    marker path { fill: var(--line); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" />
    </marker>
  </defs>

  <!-- Main column: 6 boxes, 340 wide, 52 tall, 24 apart -->
  <rect x="1" y="1" width="340" height="52" />
  <text x="14" y="23">USASpending.gov bulk files</text>
  <text class="sub" x="14" y="42">yearly full files + monthly changes</text>

  <rect x="1" y="77" width="340" height="52" />
  <text x="14" y="99">Extract (Python)</text>
  <text class="sub" x="14" y="118">download, filter to scope, trim columns</text>

  <rect x="1" y="153" width="340" height="52" />
  <text x="14" y="175">Amazon S3</text>
  <text class="sub" x="14" y="194">raw zips + prestaged CSVs</text>

  <rect x="1" y="229" width="340" height="52" />
  <text x="14" y="251">Redshift Serverless</text>
  <text class="sub" x="14" y="270">COPY into raw tables, idempotent</text>

  <rect x="1" y="305" width="340" height="52" />
  <text x="14" y="327">dbt</text>
  <text class="sub" x="14" y="346">staging → star schema → reporting</text>

  <rect x="1" y="381" width="340" height="52" />
  <text x="14" y="403">Power BI</text>
  <text class="sub" x="14" y="422">six-page dashboard</text>

  <path class="arrow" d="M171,53 V75" />
  <path class="arrow" d="M171,129 V151" />
  <path class="arrow" d="M171,205 V227" />
  <path class="arrow" d="M171,281 V303" />
  <path class="arrow" d="M171,357 V379" />

  <!-- Airflow: a narrow bracket spanning extract → dbt, label rotated so the diagram stays narrow -->
  <path class="bracket" d="M350,103 H366 V331 H350" />
  <text class="sub" transform="translate(392 217) rotate(90)" text-anchor="middle">Airflow · monthly</text>
</svg>
